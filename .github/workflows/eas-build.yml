name: EAS Build (Development)

# MANUAL ONLY. Previously this auto-triggered a cloud EAS build on every push to
# every branch — that violated our "no unattended builds" rule (each push spent
# build minutes and could ship a build nobody approved). It is now dispatch-only:
# a human picks the profile and clicks Run. No automatic triggers.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - preview2
          - preview3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build iOS (manual)
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (safety gate)
        run: npm run typecheck

      - name: Test (safety gate)
        run: npm test -- --passWithNoTests --forceExit

      - name: Guard — production not allowed here
        run: |
          if [ "${{ github.event.inputs.profile }}" = "production" ]; then
            echo "::error::Production builds do not run from this workflow. Use the gated EAS TestFlight Submit workflow."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build with EAS
        if: env.EAS_TOKEN != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive

      - name: Skip EAS build (EAS_TOKEN not configured)
        if: env.EAS_TOKEN == ''
        run: echo "EAS_TOKEN secret not set — skipping EAS build. Add it to repo secrets to enable cloud builds."

      # Build artifacts are uploaded to EAS Build logs automatically.
      # For TestFlight / App Store submission, see eas-testflight-submit.yml.
