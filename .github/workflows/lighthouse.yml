name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/lighthouse/package-lock.json

      - name: Select temporary browser cache
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/lighthouse-browser" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Install locked audit tools and browser
        run: |
          npm ci --prefix .github/lighthouse --ignore-scripts
          .github/lighthouse/node_modules/.bin/puppeteer browsers install chrome

      - name: Verify isolated fixture settings
        run: node --test .github/lighthouse/fixture.test.cjs

      - name: Build synthetic first-launch fixture
        run: node .github/lighthouse/build.cjs

      - name: Run Lighthouse CI
        run: .github/lighthouse/node_modules/.bin/lhci autorun
        env:
          NODE_PATH: ${{ github.workspace }}/.github/lighthouse/node_modules
          # Optional PR annotations; not an app/backend credential.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Preserve first-launch proof and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-first-launch
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
