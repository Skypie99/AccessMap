name: Lighthouse CI

on:
  pull_request:
    branches: [main]

# S-4 (security audit 2026-07-31): this workflow had no `permissions:` block, so
# it silently inherited the repo/org default GITHUB_TOKEN scope — which is not
# declared anywhere in this repo and can be org-wide read-write. It only reads
# the code and posts Lighthouse results, so pin it to the minimum.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install serve
        run: npm install -g serve

      - name: Build web export for the audit
        run: npx expo export --platform web
        env:
          # Public Expo config is baked into the exported bundle at build time.
          # CI has no `.env` and must not need real services: without these
          # values src/lib/supabase.ts throws at load ("Supabase env vars are
          # missing") and the audit would only measure an error screen. These
          # are obviously synthetic, non-credential placeholder values for the
          # audit fixture — never real service credentials (S-4). Building here
          # (instead of inside LHCI's startServerCommand) also means a failed
          # export fails this named step honestly instead of racing the audit.
          CI: '1'
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_SUPABASE_URL: 'http://localhost:9001'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'lighthouse-ci-not-a-credential'

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          # Optional: add LHCI_GITHUB_APP_TOKEN secret in repo settings to enable
          # inline PR status annotations. Without it, Lighthouse still runs and
          # uploads results to temporary-public-storage — just no PR check annotation.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
