name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: |
          if npx eslint --version > /dev/null 2>&1; then
            npm run lint
          else
            echo "ESLint not installed — skipping. Run: npm i -D eslint eslint-config-expo prettier eslint-config-prettier"
          fi

      - name: Format check
        run: |
          if npx prettier --version > /dev/null 2>&1; then
            npm run format:check
          else
            echo "Prettier not installed — skipping. Run: npm i -D prettier eslint-config-prettier"
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci -- --passWithNoTests --forceExit --watchAll=false
