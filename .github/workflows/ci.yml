name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # Format check is deliberately NOT a gate. It has never once passed: the
      # commit that added Prettier (52fb592) added this step at the same time and
      # never reformatted the existing code, so CI has been red on every run
      # since — 25 for 25 at the time of writing. A permanently-red check is
      # worse than no check, because it trains everyone to ignore CI mail, which
      # is exactly what happened.
      #
      # It cannot simply be fixed by running the formatter. `prettier --write src`
      # touches 178 files and BREAKS 5 guard tests — privacyLink, terms,
      # bp10SeverityGrammarGuards, tasksHeaderReclaim and qaMergeConsolidation —
      # because those guards pin exact source text and indentation to protect
      # ratified copy and a11y wiring (PROTECT-11, §SKY-6). Prettier rewraps the
      # very lines they assert on. Verified by doing it: typecheck and lint stayed
      # clean, the guards went red.
      #
      # So the guards win — they protect user-facing promises; formatting is
      # cosmetic. `npm run format` still exists for anyone who wants it on a file
      # they are already editing.
      #
      # To make this a gate again, first make the 5 guards formatting-insensitive
      # (normalise whitespace before matching, since what they actually care about
      # is semantic), THEN reformat, THEN restore this step.

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci -- --passWithNoTests --forceExit --watchAll=false

  perf-budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        run: npx expo export --platform web 2>&1 || true

      - name: Check bundle size budget
        # Budget: web build <= 2 MB gzipped. Baseline ~1.1 MB (bc3ff72).
        # See docs/PERFORMANCE_BUDGET.md for full baseline + rationale.
        run: |
          if [ ! -d "dist" ]; then
            echo "No dist/ — web build failed or output dir changed. Skipping."
            exit 0
          fi
          TOTAL_GZ=$(find dist -name "*.js" -exec gzip -c {} \; | wc -c)
          TOTAL_GZ_MB=$(echo "scale=2; $TOTAL_GZ / 1048576" | bc)
          BUDGET_BYTES=2097152
          echo "Bundle size (gzipped): ${TOTAL_GZ_MB} MB"
          if [ "$TOTAL_GZ" -gt "$BUDGET_BYTES" ]; then
            echo "FAIL: Bundle exceeds 2 MB gzipped (${TOTAL_GZ_MB} MB). See docs/PERFORMANCE_BUDGET.md."
            exit 1
          fi
          echo "PASS: Bundle within budget."
