name: EAS TestFlight Submit

# This is the only canonical build-and-submit path. It binds an accepted source
# SHA to the workflow event and checked-out HEAD, then uses fixed EAS profiles.
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'FULL 40-character lowercase Git SHA accepted for this release'
        required: true
        type: string
      d8_closed:
        description: 'Type "yes" ONLY after final-candidate physical-device EXIF/GPS stored-object proof and owner sign-off exist'
        required: false
        default: 'no'
        type: string

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    name: Build and submit exact TestFlight candidate
    environment: release-approval
    steps:
      - name: Validate accepted release SHA
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_release_sha must be a full 40-character lowercase Git SHA"
            exit 1
          fi

          if [ "$EXPECTED_RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::expected_release_sha does not match GITHUB_SHA"
            exit 1
          fi

          echo "Accepted release SHA matches GITHUB_SHA: $EXPECTED_RELEASE_SHA"

      - name: Require D8 final-device proof
        env:
          D8_CLOSED: ${{ inputs.d8_closed }}
        run: |
          set -euo pipefail

          if [ "$D8_CLOSED" != "yes" ]; then
            echo "::error::D8 is not closed. Use d8_closed=yes only after final-candidate physical-device EXIF/GPS stored-object proof and owner sign-off exist."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify checked-out source identity
        id: source_identity
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail

          HEAD="$(git rev-parse HEAD)"

          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out HEAD does not match GITHUB_SHA"
            exit 1
          fi

          if [ "$HEAD" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked-out HEAD does not match expected_release_sha"
            exit 1
          fi

          echo "head_sha=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Guard fixed EAS profiles
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const testflight = eas.build?.testflight;
          const invariants = [
            ['build.testflight.exists', Boolean(testflight)],
            ['build.testflight.distribution', testflight?.distribution, 'store'],
            ['build.testflight.environment', testflight?.environment, 'production'],
            ['build.testflight.env.APP_ENV', testflight?.env?.APP_ENV, 'production'],
            ['build.testflight.ios.buildConfiguration', testflight?.ios?.buildConfiguration, 'Release'],
            ['build.testflight.ios.simulator', testflight?.ios?.simulator, false],
            ['submit.production.exists', Boolean(eas.submit?.production)],
          ];

          let failed = false;
          for (const [name, actual, expected = true] of invariants) {
            console.log(`${name}=${String(actual)}`);
            if (actual !== expected) {
              console.error(`::error::EAS profile invariant failed: ${name}`);
              failed = true;
            }
          }

          if (failed) process.exit(1);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --passWithNoTests --forceExit

      - name: Install pinned EAS CLI
        run: |
          set -euo pipefail
          npm install --global eas-cli@23.0.0
          eas --version

      - name: Build and submit linked TestFlight candidate
        id: eas_build_submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is not configured"
            exit 1
          fi

          eas build --platform ios --profile testflight --auto-submit-with-profile=production --wait --non-interactive

      - name: Write non-secret provenance receipt
        if: always()
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          CHECKED_OUT_HEAD: ${{ steps.source_identity.outputs.head_sha }}
          EAS_STEP_OUTCOME: ${{ steps.eas_build_submit.outcome }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            '## Release provenance receipt' \
            "- Expected accepted SHA: $EXPECTED_RELEASE_SHA" \
            "- GITHUB_SHA: $GITHUB_SHA" \
            "- Checked-out HEAD: ${CHECKED_OUT_HEAD:-unavailable}" \
            "- GITHUB_REF: $GITHUB_REF" \
            "- GITHUB_RUN_ID: $GITHUB_RUN_ID" \
            "- GITHUB_RUN_ATTEMPT: $GITHUB_RUN_ATTEMPT" \
            "- GITHUB_WORKFLOW: $GITHUB_WORKFLOW" \
            '- Fixed build profile: testflight' \
            '- Fixed submit profile: production' \
            '- Pinned EAS CLI version: 23.0.0' \
            "- EAS build/submit step outcome: ${EAS_STEP_OUTCOME:-unavailable}" \
            >> "$GITHUB_STEP_SUMMARY"
