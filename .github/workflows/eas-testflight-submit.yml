name: EAS TestFlight Submit

# MANUAL ONLY, WITH APPROVAL. Previously this auto-built AND submitted to the
# App Store on any `v*` tag push — that could ship to production unattended while
# the D8 EXIF GPS privacy blocker is still open. Now:
#   - dispatch-only (no tag/push trigger),
#   - runs in the `release-approval` GitHub Environment so a required reviewer
#     must approve the run before any build/submit happens (see SETUP note below),
#   - production is hard-blocked by a privacy guard until D8 is closed.
#
# SETUP (one-time, in GitHub UI): Settings → Environments → New environment
#   "release-approval" → add Sky as a Required reviewer. Until that environment
#   exists with a reviewer, treat this workflow as not-yet-armed.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - preview2
          - preview3
          - production
      d8_closed:
        description: 'Type "yes" ONLY if the D8 EXIF GPS privacy blocker is closed (required for production)'
        required: false
        default: 'no'
        type: string

# S-4 (security audit 2026-07-31): this workflow had NO `permissions:` block
# while handling the most powerful secrets in the repo — EAS_TOKEN and an Apple
# Developer account password — so it inherited an undeclared, possibly org-wide
# read-write GITHUB_TOKEN scope. That inversion (the least-privileged workflow
# declared a ceiling; the most-privileged one did not) is the finding.
#
# `contents: write` is genuinely required: the release step below publishes a
# GitHub Release via softprops/action-gh-release. Declared explicitly rather
# than inherited, and nothing broader is granted.
permissions:
  contents: write

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    name: Build & Submit (manual, approved)
    environment: release-approval
    steps:
      - uses: actions/checkout@v4

      - name: Privacy gate — block production while D8 is open
        run: |
          if [ "${{ github.event.inputs.profile }}" = "production" ] && [ "${{ github.event.inputs.d8_closed }}" != "yes" ]; then
            echo "::error::Production submit blocked. The D8 EXIF GPS privacy leak is a pre-launch blocker. Re-run with d8_closed=yes ONLY after it is confirmed closed in PROJECT_STATE.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --passWithNoTests --forceExit

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build with EAS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive

      - name: Submit to App Store Connect
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: eas submit --platform ios --profile production --latest --non-interactive

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body: |
            TestFlight build submitted for version ${{ github.ref_name }}.
            Check App Store Connect for review status.
          draft: false
          prerelease: false
