<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Attribution + share metadata (truthful: a web app, no app-store claim). -->
    <meta name="description" content="Community-powered accessibility map — report and verify accessibility barriers in your community. A project by Sky Halisky." />
    <meta name="author" content="Sky Halisky" />
    <link rel="canonical" href="https://accessmap.skypistudio.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AccessMap" />
    <meta property="og:title" content="AccessMap — community-powered accessibility map" />
    <meta property="og:description" content="Report and verify accessibility barriers in your community. A project by Sky Halisky." />
    <meta property="og:url" content="https://accessmap.skypistudio.com/" />
    <meta property="og:image" content="https://accessmap.skypistudio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AccessMap — community-powered accessibility map, a project by Sky Halisky" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AccessMap — community-powered accessibility map" />
    <meta name="twitter:description" content="Report and verify accessibility barriers in your community. A project by Sky Halisky." />
    <meta name="twitter:image" content="https://accessmap.skypistudio.com/og-image.png" />

    <!-- PWA: installable manifest + theme color (light brand / dark nav chrome) + iOS home-screen icon -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1466E0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1829" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="am-a11y-focus">
      /* WCAG 2.4.7 — visible keyboard focus on the web build. :focus-visible
         fires only for keyboard / assistive-tech focus (never on mouse click),
         so pointer users see nothing new. The app's Button/Card primitives draw
         their own focus ring; this is the safety net for every other focusable
         element (links, inputs, raw pressables) react-native-web renders. */
      :focus-visible {
        outline: 2px solid #1466E0;
        outline-offset: 2px;
        border-radius: 3px;
      }

      /* L3-1 — "Skip to content". SC 2.4.1 is already satisfied by technique
         (each screen opens with a heading, and the repeated chrome is only a
         menu + Feedback button), so this is hardening rather than a fix: it
         costs one hidden anchor and stops mattering only until the header
         family grows. Visible ONLY on keyboard focus, so it never intrudes. */
      .am-skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 1000;
        padding: 10px 16px;
        background: #1466E0;
        color: #fff;
        font: 600 15px/1.2 system-ui, -apple-system, sans-serif;
        border-radius: 0 0 6px 0;
        text-decoration: none;
      }
      .am-skip-link:focus {
        left: 0;
      }
    </style>
    <style id="am-splash-style">
      /* Instant-paint brand splash shown before the JS bundle mounts. React
         (createRoot) replaces #root's children when the app mounts, so this
         needs no removal script and can never get "stuck". The brand pin paints
         in the first frame; colors + the pre-paint page background harmonise to
         the OS theme so the cold open never flashes white before the app's
         always-dark map (CartoDB Dark Matter). AA-legible; reduced-motion safe. */

      /* KEEP IN SYNC WITH theme.ts / app.json — this static <head> can't import the
         design tokens, so the brand hexes in this file are copied by hand. If a
         brand/surface token changes in theme.ts, update its twin here (and the
         app.json splash / themeColor / notification literals). Current set — 11
         distinct colours in this file + the app.json front-door literals:
           LIGHT: #1466E0 (brand — pin / name / dots, the light theme-color meta, and
                  the focus ring), #ffffff (page bg = color.surface), #2B3A55 (tagline),
                  #44546F (byline), #0E57C2 (byline link — high-contrast brand).
           DARK:  #0d1829 (dark theme-color / nav chrome), #111111 (page bg = the dark
                  surface, ~#111), #4E89EF (brand pin = darkColor.brand), #84AEF6 (name +
                  link = darkColor.brandText), #C9D4E3 (tagline), #9AA8BD (byline).
           app.json: #1466E0 (splash.backgroundColor === web.themeColor ===
                  notification.color — unified in R2/T19), #ffffff (adaptiveIcon / web bg).
         Parity is pinned by theme.test.ts (the brand hexes + the T19 OS-chrome guard). */

      /* Harmonise the pre-paint page background to the OS theme. Parsed in
         <head> before <body> paints, so the very first frame already matches —
         no white flash ahead of the dark map for dark-mode visitors. */
      html, body { background: #ffffff; }

      #am-splash {
        margin: auto;
        max-width: 32rem;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #am-splash .am-logo { display: block; margin: 0 auto 18px; width: 58px; height: 72px; }
      #am-splash .am-pin { fill: #1466E0; }
      #am-splash .am-name { margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -1.2px; color: #1466E0; }
      #am-splash .am-tag { margin: 12px 0 0; font-size: 17px; line-height: 1.5; color: #2B3A55; }
      #am-splash .am-by { margin: 18px 0 0; font-size: 14px; color: #44546F; }
      #am-splash .am-by a { color: #0E57C2; font-weight: 600; text-decoration: none; }
      #am-splash .am-by a:hover, #am-splash .am-by a:focus { text-decoration: underline; }

      /* Loading cue — three dots with a gentle stagger so the long bundle parse
         reads as "working", not "broken/frozen". Animation only; the dots stay
         visible (static) under Reduce Motion. */
      #am-splash .am-dots { display: flex; gap: 8px; justify-content: center; margin: 22px 0 0; }
      #am-splash .am-dots span {
        width: 8px; height: 8px; border-radius: 50%;
        background: #1466E0; opacity: 0.35;
        animation: am-dot 1.2s ease-in-out infinite;
      }
      #am-splash .am-dots span:nth-child(2) { animation-delay: 0.18s; }
      #am-splash .am-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes am-dot {
        0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }

      /* Dark-mode palette — pin + text lightened to the app's dark tokens,
         page background = the app's dark surface (#111) for a seamless handoff. */
      @media (prefers-color-scheme: dark) {
        html, body { background: #111111; }
        #am-splash .am-pin { fill: #4E89EF; }
        #am-splash .am-name { color: #84AEF6; }
        #am-splash .am-tag { color: #C9D4E3; }
        #am-splash .am-by { color: #9AA8BD; }
        #am-splash .am-by a { color: #84AEF6; }
        #am-splash .am-dots span { background: #4E89EF; }
      }

      /* WCAG 2.3.3 — no motion under Reduce Motion; dots remain as a static cue. */
      @media (prefers-reduced-motion: reduce) {
        #am-splash .am-dots span { animation: none; opacity: 0.6; transform: none; }
      }
    </style>
    <style id="am-a11y-reduce-transparency">
      /* A11Y-232 (SR-073) — the Reduce Transparency twin of the query above.
         On iOS the app honours Reduce Transparency centrally: GlassSurface
         drops its blur for the arbitrated opaque fill. On WEB it could not —
         RN's reduce-transparency signal is structurally false in a browser,
         so the four raw CSS backdrop-filter surfaces (tab bar, sign-in card,
         onboarding cards, drawer panel) stayed frosted no matter what the
         user had asked their OS for.

         backdrop-filter is DECORATION here: every one of those surfaces
         already carries an arbitrated opaque-enough floor underneath, so
         removing the blur removes an effect, never a contrast guarantee. */
      @media (prefers-reduced-transparency: reduce) {
        [style*="backdrop-filter"],
        [style*="backdropFilter"] {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. The brand splash inside it paints
         instantly and is replaced by the app on mount (so the first beat reads
         as AccessMap, not a blank/broken screen). -->
    <!-- L3-1: first focusable thing on the page, so one Tab from page load
         jumps a keyboard user past the chrome. #root is where the app mounts. -->
    <a class="am-skip-link" href="#root">Skip to content</a>
    <div id="root">
      <div id="am-splash">
        <!-- AccessMap brand mark: a Wayfinder-Blue map pin carrying a white
             striding figure (accessibility + wayfinding). Same artwork as
             src/components/LogoMark.tsx (96×120 artboard). Decorative — the
             wordmark below carries the name for assistive tech. -->
        <svg class="am-logo" viewBox="0 0 96 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path class="am-pin" d="M48 4 C24 4 8 22 8 46 C8 79 40 108 46.2 113.6 C47.2 114.5 48.8 114.5 49.8 113.6 C56 108 88 79 88 46 C88 22 72 4 48 4 Z" />
          <circle cx="48" cy="33" r="7.5" fill="#fff" />
          <path d="M48 47 L48 74" stroke="#fff" stroke-width="9" stroke-linecap="round" />
          <path d="M31 66 L48 48 L65 66" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <p class="am-name">AccessMap</p>
        <p class="am-tag">Community-powered accessibility map — report and verify accessibility barriers in your community.</p>
        <div class="am-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="am-by">A project by <a href="https://skypistudio.com" target="_blank" rel="noopener">Sky Halisky</a> · see more work at skypistudio.com</p>
      </div>
    </div>

    <!-- Service Worker registration for offline map browsing support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('[AccessMap SW] Registered, scope:', reg.scope);
            })
            .catch(function (err) {
              // Non-fatal — app works fine without SW, just no offline support.
              console.warn('[AccessMap SW] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
